<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- TuffBox  Frost/Glacier. Crisp T, no letter bloom blur. -->
  <defs>
    <radialGradient id="plate" cx="36%" cy="26%" r="74%" fx="30%" fy="20%">
      <stop offset="0%" stop-color="#0c2234"/>
      <stop offset="38%" stop-color="#061828"/>
      <stop offset="72%" stop-color="#001020"/>
      <stop offset="100%" stop-color="#00060c"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#a8e6ff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#0388d2" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0388d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tBody" x1="50%" y1="12%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0faff"/>
      <stop offset="12%" stop-color="#e0f2fe"/>
      <stop offset="32%" stop-color="#a8e6ff"/>
      <stop offset="58%" stop-color="#38bdf8"/>
      <stop offset="82%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0c4c7a"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0faff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#a8e6ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueMote" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0388d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tShade" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#001020" stop-opacity="0.45"/>
      <stop offset="48%" stop-color="#001020" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a8e6ff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="tSpec" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0faff" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#a8e6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a8e6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a8e6ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28"/>
    </filter>
    <filter id="emberBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="letterShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.2" flood-color="#00060c" flood-opacity="0.65"/>
    </filter>
    <filter id="sparkBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <clipPath id="plateClip">
      <rect x="112" y="112" width="288" height="288" rx="64" ry="64"/>
    </clipPath>
    <path id="tOutline" d="M -72 -86 L 72 -86 Q 86 -86 86 -72 L 86 -54 Q 86 -44 74 -44 L 24 -44 L 24 84 Q 24 96 12 96 L -12 96 Q -24 96 -24 84 L -24 -44 L -74 -44 Q -86 -44 -86 -54 L -86 -72 Q -86 -86 -72 -86 Z"/>
  </defs>
  <g clip-path="url(#plateClip)">
    <rect x="112" y="112" width="288" height="288" rx="64" ry="64" fill="url(#plate)"/>
    <ellipse cx="256" cy="236" rx="132" ry="132" fill="url(#bloom)" filter="url(#softGlow)" opacity="0.7"/>
    <ellipse cx="256" cy="210" rx="140" ry="100" fill="#38bdf8" opacity="0.03" filter="url(#softGlow)"/>
    <g filter="url(#emberBlur)" opacity="0.85">
      <circle cx="168" cy="178" r="1.8" fill="#a8e6ff"/>
      <circle cx="346" cy="196" r="1.3" fill="#38bdf8"/>
      <circle cx="328" cy="340" r="1.7" fill="#7dd3fc"/>
      <circle cx="178" cy="346" r="1.2" fill="#a8e6ff" opacity="0.7"/>
      <circle cx="352" cy="278" r="1.1" fill="#06b6d4"/>
      <circle cx="152" cy="268" r="1.3" fill="#38bdf8" opacity="0.65"/>
      <circle cx="290" cy="158" r="1.1" fill="#f0faff" opacity="0.5"/>
    </g>
    <g transform="translate(256 244) scale(0.78)">
      <g filter="url(#sparkBlur)">
        <circle cx="-96" cy="-70" r="2.2" fill="url(#spark)"/>
        <circle cx="-88" cy="-48" r="1.1" fill="url(#blueMote)"/>
        <circle cx="94" cy="-66" r="1.8" fill="url(#spark)"/>
        <circle cx="102" cy="-42" r="1.2" fill="url(#blueMote)"/>
        <circle cx="48" cy="-108" r="1.0" fill="url(#spark)" opacity="0.7"/>
        <circle cx="-40" cy="-110" r="0.9" fill="#a8e6ff" opacity="0.55"/>
        <circle cx="-42" cy="78" r="1.6" fill="url(#blueMote)"/>
        <circle cx="44" cy="70" r="1.3" fill="url(#spark)" opacity="0.75"/>
        <circle cx="8" cy="118" r="1.1" fill="url(#blueMote)" opacity="0.7"/>
        <circle cx="-108" cy="8" r="1.4" fill="url(#spark)" opacity="0.65"/>
        <circle cx="112" cy="18" r="1.0" fill="#06b6d4" opacity="0.45"/>
        <path d="M -98 -28 L -92 -22" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M 96 -24 L 102 -18" stroke="#a8e6ff" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M -36 108 L -30 114" stroke="#0388d2" stroke-opacity="0.35" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g filter="url(#letterShadow)">
        <use href="#tOutline" fill="url(#tBody)"/>
        <use href="#tOutline" fill="url(#tShade)"/>
        <path d="M -72 -86 L 72 -86 Q 86 -86 86 -72 L 86 -60 L -86 -60 L -86 -72 Q -86 -86 -72 -86 Z" fill="url(#tSpec)"/>
        <path d="M -66 -44 L 66 -44" stroke="#a8e6ff" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <rect x="116" y="116" width="280" height="280" rx="60" ry="60" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
